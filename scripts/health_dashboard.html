<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store Microservices Health Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .service-card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            transition: transform 0.3s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .service-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .healthy {
            background-color: #27ae60;
            color: white;
        }
        .unhealthy {
            background-color: #e74c3c;
            color: white;
        }
        .unknown {
            background-color: #f39c12;
            color: white;
        }
        .check-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .check-name {
            color: #7f8c8d;
        }
        .check-status {
            font-weight: bold;
        }
        .check-status.ok {
            color: #27ae60;
        }
        .check-status.error {
            color: #e74c3c;
        }
        .check-status.warning {
            color: #f39c12;
        }
        .refresh-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }
        .refresh-btn:hover {
            background-color: #2980b9;
        }
        .last-updated {
            text-align: center;
            color: #7f8c8d;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .dependency-checks {
            margin-top: 15px;
            border-top: 1px dashed #eee;
            padding-top: 10px;
        }
        .dependency-title {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>E-Store Microservices Health Dashboard</h1>
        
        <div class="services" id="services-container">
            <!-- Service cards will be inserted here -->
        </div>
        
        <button class="refresh-btn" onclick="checkAllServices()">Refresh Status</button>
        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        // Service endpoints
        const services = {
            'product-service': 'http://localhost:8000/health',
            'payment-service': 'http://localhost:8001/health',
            'coupon-service': 'http://localhost:8002/health',
            'order-service': 'http://localhost:8003/health'
        };

        // Function to format date
        function formatDate(date) {
            return new Intl.DateTimeFormat('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).format(date);
        }

        // Function to check a single service
        async function checkService(serviceName, endpoint) {
            try {
                const response = await fetch(endpoint, { timeout: 5000 });
                if (response.ok) {
                    const data = await response.json();
                    return {
                        name: serviceName,
                        status: data.status || 'unknown',
                        checks: data.checks || {},
                        dependencies: data.checks?.dependencies || {}
                    };
                } else {
                    return {
                        name: serviceName,
                        status: 'unhealthy',
                        checks: {
                            api: `error: HTTP ${response.status}`
                        }
                    };
                }
            } catch (error) {
                return {
                    name: serviceName,
                    status: 'unhealthy',
                    checks: {
                        api: `error: ${error.message}`
                    }
                };
            }
        }

        // Function to check all services
        async function checkAllServices() {
            const servicesContainer = document.getElementById('services-container');
            servicesContainer.innerHTML = '';

            for (const [serviceName, endpoint] of Object.entries(services)) {
                // Create placeholder card
                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <div class="service-header">
                        <div class="service-name">${serviceName}</div>
                        <div class="status unknown">Checking...</div>
                    </div>
                    <div class="check-item">
                        <div class="check-name">API</div>
                        <div class="check-status warning">Checking...</div>
                    </div>
                `;
                servicesContainer.appendChild(card);

                // Check service health
                const serviceHealth = await checkService(serviceName, endpoint);
                
                // Update card with health info
                updateServiceCard(card, serviceHealth);
            }

            // Update last checked time
            document.getElementById('last-updated').textContent = `Last updated: ${formatDate(new Date())}`;
        }

        // Function to update a service card with health info
        function updateServiceCard(card, serviceHealth) {
            const statusClass = serviceHealth.status === 'healthy' ? 'healthy' : 'unhealthy';
            
            let checksHtml = '';
            
            // Add basic checks
            for (const [checkName, checkValue] of Object.entries(serviceHealth.checks)) {
                if (checkName !== 'dependencies') {
                    const isError = checkValue.toString().toLowerCase().includes('error');
                    const statusClass = isError ? 'error' : 'ok';
                    checksHtml += `
                        <div class="check-item">
                            <div class="check-name">${checkName}</div>
                            <div class="check-status ${statusClass}">${checkValue}</div>
                        </div>
                    `;
                }
            }
            
            // Add dependency checks if they exist
            if (serviceHealth.checks.dependencies) {
                checksHtml += `<div class="dependency-checks">
                    <div class="dependency-title">Dependencies:</div>`;
                
                for (const [depName, depStatus] of Object.entries(serviceHealth.checks.dependencies)) {
                    const isError = depStatus.toString().toLowerCase().includes('error');
                    const statusClass = isError ? 'error' : 'ok';
                    checksHtml += `
                        <div class="check-item">
                            <div class="check-name">${depName}</div>
                            <div class="check-status ${statusClass}">${depStatus}</div>
                        </div>
                    `;
                }
                
                checksHtml += `</div>`;
            }
            
            card.innerHTML = `
                <div class="service-header">
                    <div class="service-name">${serviceHealth.name}</div>
                    <div class="status ${statusClass}">${serviceHealth.status}</div>
                </div>
                ${checksHtml}
            `;
        }

        // Initial check when page loads
        document.addEventListener('DOMContentLoaded', checkAllServices);
    </script>
</body>
</html>
