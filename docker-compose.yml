version: '3.8'

services:
  product-service:
    build: ./product
    ports:
      - "8000:8000"
    volumes:
      - ./product:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@product-db:5432/product_db
    depends_on:
      - product-db
    networks:
      - e-store-network

  product-db:
    image: postgres:13
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=product_db
    volumes:
      - product-db-data:/var/lib/postgresql/data
    networks:
      - e-store-network

  payment-service:
    build: ./payment
    ports:
      - "8001:8001"
    volumes:
      - ./payment:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@payment-db:5432/payment_db
      - STRIPE_API_KEY=your_stripe_api_key
      - STRIPE_WEBHOOK_SECRET=your_stripe_webhook_secret
    depends_on:
      - payment-db
    networks:
      - e-store-network

  payment-db:
    image: postgres:13
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payment_db
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - e-store-network

  coupon-service:
    build: ./coupon
    ports:
      - "8002:8002"
    volumes:
      - ./coupon:/app
    environment:
      - MONGODB_URI=mongodb://coupon-db:27017/coupon_db
    depends_on:
      - coupon-db
    networks:
      - e-store-network

  coupon-db:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - coupon-db-data:/data/db
    networks:
      - e-store-network

  order-service:
    build: ./order
    ports:
      - "8003:8003"
    volumes:
      - ./order:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@order-db:5432/order_db
      - PRODUCT_SERVICE_URL=http://product-service:8000/api
      - PAYMENT_SERVICE_URL=http://payment-service:8001/api
      - COUPON_SERVICE_URL=http://coupon-service:8002/api
    depends_on:
      - order-db
      - product-service
      - payment-service
      - coupon-service
    networks:
      - e-store-network

  order-db:
    image: postgres:13
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order_db
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks:
      - e-store-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - product-service
      - payment-service
      - coupon-service
      - order-service
    networks:
      - e-store-network

networks:
  e-store-network:
    driver: bridge

volumes:
  product-db-data:
  payment-db-data:
  coupon-db-data:
  order-db-data:
